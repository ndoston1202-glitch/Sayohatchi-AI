<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="description" content="Dam olish maskanlari sharhlarini AI yordamida tahlil qiluvchi platforma: Trust Score, shubhali sharhlar, reklama va real rasm taqqoslash.">
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayohatchi AI</title>
<style>
:root{--pri:#2b2770;--pri2:#5b4fd6;--bg:#f4f5fb;--card:#fff;--txt:#1d1d2b;--mut:#6b6f85;--ok:#1f9d55;--warn:#e0a100;--bad:#d64545;--line:#e4e6f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:72px}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:18px 16px 22px}
header .brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
header h1{font-size:22px;margin:14px 0 12px;line-height:1.25}
.back{background:none;border:0;color:#fff;font-size:15px;padding:0;margin-bottom:6px}
main{padding:14px 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,20,60,.07)}
.search{display:flex;gap:8px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--txt)}
textarea{min-height:90px}
button.btn{background:var(--pri2);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font:inherit;font-weight:700}
button.btn.sec{background:#eceafd;color:var(--pri)}
button.btn.bad{background:#fde8e8;color:var(--bad)}
button.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 6px}
.score{font-size:34px;font-weight:800;line-height:1}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700}
.g{background:#e3f6ea;color:var(--ok)}.y{background:#fff4d6;color:#a77800}.r{background:#fde8e8;color:var(--bad)}.n{background:#eef0f5;color:var(--mut)}
.ring{width:84px;height:84px;flex:none}
.metric{margin:9px 0}
.bar{height:8px;background:#eceef5;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px}
.res{display:flex;gap:12px;align-items:center}
.res .sc{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.info3{display:grid;gap:10px}
.info3 .card{margin:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--pri2);font-weight:700}
nav svg{width:22px;height:22px}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev:first-child{border-top:0}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgbox{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--mut);font-size:13px;text-align:center}
.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox input{position:absolute;inset:0;opacity:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{border:0;background:#fff;padding:8px 12px;border-radius:20px;font:inherit;font-size:13px;white-space:nowrap;color:var(--mut)}
.tabs button.on{background:var(--pri2);color:#fff}
.stars button{background:none;border:0;font-size:28px;color:#d4d6e0;padding:0 2px}
.stars button.on{color:#f5b301}
.note{background:#eef0ff;border-left:3px solid var(--pri2);padding:10px;border-radius:8px;font-size:13px;color:var(--pri)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.prog{height:6px;background:#eceef5;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri2);transition:width .2s}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{margin:0;text-align:center}.stat b{font-size:24px;display:block}
.save{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 12px;font:inherit}
/* Kompyuter ekrani: markazlashgan konteyner, kartochkalar 2 ustunda */
@media (min-width:760px){
  body{padding-bottom:0;padding-top:64px}
  #app{max-width:1040px;margin:0 auto}
  header{border-radius:0 0 20px 20px;padding:28px 32px 32px}
  header h1{font-size:30px}
  main{padding:20px 24px}
  .info3{grid-template-columns:repeat(3,1fr)}
  #results,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #results>.mut{grid-column:1/-1}
  #results .card{margin:0}
  nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:8px;padding:0}
  nav button{flex:none;flex-direction:row;gap:8px;font-size:14px;padding:18px 18px}
  nav svg{width:18px;height:18px}
  .toast{bottom:24px}
  .imgs{max-width:560px}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
